<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="8" />

  <!-- Video Film Reel Frame Top & Bottom Notches -->
  <rect x="96" y="80" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="160" y="80" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="224" y="80" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="288" y="80" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="352" y="80" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="96" y="408" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="160" y="408" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="224" y="408" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="288" y="408" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="352" y="408" width="32" height="24" rx="6" fill="#334155" opacity="0.6"/>

  <!-- Main Viewfinder / Aperture Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-dasharray="24 12" opacity="0.85" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="105" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="10" />

  <!-- AI Lens Iris / Core -->
  <circle cx="256" cy="256" r="75" fill="url(#primaryGrad)" />

  <!-- Play / Vision Center Prism -->
  <polygon points="238,215 298,256 238,297" fill="#ffffff" />

  <!-- AI Sparkle Accents -->
  <!-- Top Right Sparkle -->
  <path d="M380 120 C380 145, 395 155, 415 155 C395 155, 380 165, 380 190 C380 165, 365 155, 345 155 C365 155, 380 145, 380 120 Z" fill="url(#accentGrad)" />
  
  <!-- Bottom Left Sparkle -->
  <path d="M125 330 C125 345, 135 352, 148 352 C135 352, 125 359, 125 374 C125 359, 115 352, 102 352 C115 352, 125 345, 125 330 Z" fill="url(#primaryGrad)" />
